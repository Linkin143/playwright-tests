name: Playwright + Allure Report

on:
  schedule:
    - cron: "40 3 * * *" # 09:10 AM IST daily

  workflow_dispatch:
    inputs:
      mode:
        description: "Select test execution mode"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - file
          - folder
          - multiple

      test_path:
        description: |
          File or folder path
          Examples:
          - tests/example.spec.ts
          - tests/msn/
        required: false

      test_list:
        description: |
          Comma-separated test files
          Example:
          tests/msn/a.spec.ts,tests/msn/b.spec.ts
        required: false

permissions:
  contents: write # needed for gh-pages deploy
  pull-requests: write # needed for allure-action PR comments
  checks: write # needed for allure-action check runs

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Install browsers
        run: npx playwright install --with-deps

      # ✅ Install Allure CLI (Allure 3)
      - name: Install Allure CLI
        run: npm install -g allure-commandline --save-dev

      # 🧠 Load schedule config (for scheduled runs)
      - name: Load Schedule Config
        id: config
        run: |
          DAY=$(date +%A | tr '[:upper:]' '[:lower:]')
          echo "Today: $DAY"

          CONFIG_FILE=".github/schedule-config.json"

          if [ -f "$CONFIG_FILE" ]; then
            MODE=$(jq -r --arg day "$DAY" '.[$day].mode // .default.mode' $CONFIG_FILE)
            TEST_PATH=$(jq -r --arg day "$DAY" '.[$day].test_path // empty' $CONFIG_FILE)
            TEST_LIST=$(jq -r --arg day "$DAY" '.[$day].test_list // empty' $CONFIG_FILE)
          else
            echo "Config file not found, using defaults"
            MODE="all"
          fi

          echo "mode=$MODE" >> $GITHUB_OUTPUT
          echo "test_path=$TEST_PATH" >> $GITHUB_OUTPUT
          echo "test_list=$TEST_LIST" >> $GITHUB_OUTPUT

      # 🔥 Dynamic Execution (Manual + Schedule) — unchanged
      - name: Run Playwright Tests
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ github.event.inputs.mode || 'all' }}"
            TEST_PATH="${{ github.event.inputs.test_path }}"
            TEST_LIST="${{ github.event.inputs.test_list }}"
            echo "Manual run"
          else
            MODE="${{ steps.config.outputs.mode }}"
            TEST_PATH="${{ steps.config.outputs.test_path }}"
            TEST_LIST="${{ steps.config.outputs.test_list }}"
            echo "Scheduled run"
          fi

          echo "Mode: $MODE"

          if [ "$MODE" = "skip" ]; then
            echo "Skipping execution for today"
            exit 0
          fi

          if [ "$MODE" = "file" ]; then
            echo "Running file: $TEST_PATH"
            npx playwright test "$TEST_PATH"

          elif [ "$MODE" = "folder" ]; then
            echo "Running folder: $TEST_PATH"
            npx playwright test "$TEST_PATH"

          elif [ "$MODE" = "multiple" ]; then
            echo "Running multiple files"
            FILES=$(echo "$TEST_LIST" | tr ',' ' ')
            npx playwright test $FILES

          else
            echo "Running all tests"
            npx playwright test
          fi

      # ✅ Preserve Allure history for TREND graphs
      - name: Preserve Allure History
        if: always()
        run: |
          if [ -d "allure-report/history" ]; then
            cp -r allure-report/history allure-results/
          fi

      # ✅ Inject rich environment metadata into Allure 3
      - name: Inject Allure Environment Info
        if: always()
        run: |
          mkdir -p allure-results

          cat > allure-results/environment.properties << EOF
          Execution=GitHub Actions
          RunID=${{ github.run_id }}
          RunNumber=${{ github.run_number }}
          Branch=${{ github.ref_name }}
          Commit=${{ github.sha }}
          Actor=${{ github.actor }}
          Repository=${{ github.repository }}
          ExecutionMode=${{ github.event.inputs.mode || steps.config.outputs.mode }}
          NodeVersion=$(node --version)
          OS=$(uname -s)
          OSRelease=$(uname -r)
          ReportURL=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          EOF

      # ✅ Executor info — links CI run in Allure 3 dashboard
      - name: Add Allure Executor Info
        if: always()
        run: |
          mkdir -p allure-results

          cat > allure-results/executor.json << EOF
          {
            "name": "GitHub Actions",
            "type": "github",
            "buildName": "Run #${{ github.run_number }} — ${{ github.ref_name }}",
            "buildUrl": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "reportUrl": "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/",
            "reportName": "Allure Report — ${{ github.event.repository.name }}"
          }
          EOF

      # ✅ Rich failure categories for Allure 3 dashboard
      - name: Add Allure Failure Categories
        if: always()
        run: |
          mkdir -p allure-results

          cat > allure-results/categories.json << 'EOF'
          [
            {
              "name": "⏱ Timeout Issues",
              "matchedStatuses": ["failed", "broken"],
              "messageRegex": ".*[Tt]imeout.*"
            },
            {
              "name": "🔍 Element Not Found",
              "matchedStatuses": ["failed", "broken"],
              "messageRegex": ".*element.*|.*locator.*|.*selector.*"
            },
            {
              "name": "✅ Assertion Failures",
              "matchedStatuses": ["failed"],
              "messageRegex": ".*expect.*|.*assert.*|.*toBe.*|.*toEqual.*"
            },
            {
              "name": "🌐 Navigation Failures",
              "matchedStatuses": ["failed", "broken"],
              "messageRegex": ".*navigation.*|.*net::ERR.*|.*ERR_.*"
            },
            {
              "name": "🔐 Auth / Login Failures",
              "matchedStatuses": ["failed", "broken"],
              "messageRegex": ".*login.*|.*auth.*|.*401.*|.*403.*"
            },
            {
              "name": "💥 Unexpected Errors",
              "matchedStatuses": ["broken"],
              "messageRegex": ".*"
            }
          ]
          EOF

      # ✅ Generate Allure 3 report with custom name
      - name: Generate Allure Report
        if: always()
        run: |
          REPORT_NAME="Playwright Report — Run #${{ github.run_number }} (${{ github.ref_name }})"
          npx allure generate allure-results --clean -o allure-report --name "$REPORT_NAME"

      # ✅ Post Allure summary to PR (Allure 3 official action)
      - name: Post Allure Summary to PR
        if: always()
        uses: allure-framework/allure-action@v0
        with:
          report-directory: "./allure-report"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # ✅ Export results as CSV artifact for download
      - name: Export Test Results CSV
        if: always()
        run: |
          echo "Test File,Status,Duration(ms),Suite,Browser" > test-results/allure-summary.csv
          if [ -d "allure-results" ]; then
            for f in allure-results/*-result.json; do
              [ -f "$f" ] || continue
              NAME=$(jq -r '.name // "unknown"' "$f")
              STATUS=$(jq -r '.status // "unknown"' "$f")
              DURATION=$(jq -r '.stop - .start // 0' "$f" 2>/dev/null || echo "0")
              SUITE=$(jq -r '.labels[]? | select(.name=="suite") | .value // "unknown"' "$f" | head -1)
              BROWSER=$(jq -r '.labels[]? | select(.name=="thread") | .value // "chromium"' "$f" | head -1)
              echo "\"$NAME\",\"$STATUS\",\"$DURATION\",\"$SUITE\",\"$BROWSER\"" >> test-results/allure-summary.csv
            done
          fi

      # ✅ Upload CSV + full results as downloadable artifacts
      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-run-${{ github.run_number }}
          path: |
            test-results/allure-summary.csv
            test-results/results.json
            test-results/junit.xml
            test-results/html-report/
            allure-report/
          retention-days: 30

      # ✅ Deploy Allure Report to GitHub Pages
      - name: Deploy Allure Report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          keep_files: true

      # ✅ Send Email
      - name: Send Email
        if: always()
        run: node sendReport.js
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          REPORT_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
