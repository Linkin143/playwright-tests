name: Playwright + Allure Report

on:
  schedule:
    - cron: '40 3 * * 1-5'  # 09:10 AM IST (Mon–Fri only)
  workflow_dispatch:
    inputs:
      mode:
        description: "Select test execution mode"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - file
          - folder
          - multiple

      test_path:
        description: |
          Provide file or folder path
          Examples:
          - tests/example.spec.ts
          - tests/msn/
        required: false

      test_list:
        description: |
          Comma-separated files
          Example:
          tests/msn/a.spec.ts,tests/msn/b.spec.ts
        required: false

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Install browsers
        run: npx playwright install --with-deps

      # 🔥 Dynamic Execution
      - name: Run Playwright Tests
        run: |
          MODE="${{ github.event.inputs.mode }}"

          if [ "$MODE" = "file" ]; then
            echo "Running file: ${{ github.event.inputs.test_path }}"
            npx playwright test "${{ github.event.inputs.test_path }}"

          elif [ "$MODE" = "folder" ]; then
            echo "Running folder: ${{ github.event.inputs.test_path }}"
            npx playwright test "${{ github.event.inputs.test_path }}"

          elif [ "$MODE" = "multiple" ]; then
            echo "Running multiple files"
            FILES=$(echo "${{ github.event.inputs.test_list }}" | tr ',' ' ')
            npx playwright test $FILES

          else
            echo "Running all tests"
            npx playwright test
          fi

      - name: Generate Allure Report
        run: npx allure generate allure-results --clean -o allure-report

      - name: Deploy Allure Report
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          keep_files: true

      - name: Send Email
        if: always()
        run: node sendReport.js
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          REPORT_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/